name: Backend foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shiftos_ci
          # Disposable credentials for this isolated CI service only.
          POSTGRES_PASSWORD: shiftos_ci_only
          POSTGRES_DB: shiftos_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftos_ci -d shiftos_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://shiftos_ci:shiftos_ci_only@localhost:5432/shiftos_ci_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend and development dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run fixture tests and PostgreSQL migration integration
        run: python -m pytest -q
