[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftos"
version = "0.1.0"
description = "Programme-wide academic decision support backend for Malaysian universities"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "SQLAlchemy==2.0.55",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.1",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[project.scripts]
shiftos = "shiftos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: requires an explicitly configured PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
